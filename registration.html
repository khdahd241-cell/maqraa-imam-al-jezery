<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>التسجيل | مقرأة الإمام الجزري</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">ق</span><span>مقرأة الإمام الجزري</span></a><button class="menu-btn">☰</button><nav class="nav-links"><a href="index.html">الرئيسية</a><a href="courses.html">الدورات</a><a class="active" href="registration.html">التسجيل</a><a href="about.html">عن المقرأة</a><a href="contact.html">تواصل معنا</a></nav></div></header>
<main><section class="page-hero"><div class="container"><span class="eyebrow">ابدأ الآن</span><h1>طلب التسجيل</h1><p>أرسل بياناتك الأولية وسنتواصل معك لتحديد المستوى والموعد.</p></div></section>
<section class="section"><div class="container form-wrap"><form id="registrationForm" class="form-card">
<div class="form-grid"><label>الاسم الكامل<input required name="name" type="text" placeholder="اكتب اسمك"></label><label>البريد الإلكتروني<input required name="email" type="email" placeholder="name@example.com"></label><label>رقم الهاتف<input required name="phone" type="tel" placeholder="+251 ..."></label><label>الدولة<input name="country" type="text" placeholder="الدولة"></label><label>المسار المطلوب<select required name="course" id="course"><option value="">اختر الدورة</option><option>التأسيس في التجويد</option><option>إتقان التلاوة</option><option>القراءة والإجازة بالسند</option></select></label><label>مستوى القراءة<select name="level"><option>مبتدئ</option><option>متوسط</option><option>متقدم</option></select></label></div>
<label>رسالتك أو هدفك<textarea name="message" rows="5" placeholder="اكتب ما تريد معرفته أو هدفك من التسجيل"></textarea></label>
<button class="btn primary" type="submit">إرسال طلب التسجيل</button><p id="formMessage" class="form-message"></p>
</form></div></section></main>
<footer class="footer"><div class="copyright">© <span id="year"></span> مقرأة الإمام الجزري.</div></footer><script src="js/script.js"></script></body></html>
